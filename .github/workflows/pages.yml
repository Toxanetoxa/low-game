name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build game
        run: npm run build
        env:
          VITE_ESCROW_ADDRESS: ${{ vars.VITE_ESCROW_ADDRESS }}
          VITE_ESCROW_CHAIN_ID: ${{ vars.VITE_ESCROW_CHAIN_ID }}
          VITE_BASE_FAUCET_URL: ${{ vars.VITE_BASE_FAUCET_URL }}
          VITE_SOLANA_ESCROW_PROGRAM: ${{ vars.VITE_SOLANA_ESCROW_PROGRAM }}
          VITE_SOLANA_FAUCET_URL: ${{ vars.VITE_SOLANA_FAUCET_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
